# Drugmate research distribution; upstream provenance is in licenses/THIRD_PARTY_NOTICES.md.
[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "drugmate"
version = "0.16.0"
description = "Drugmate: a Hermes-derived agent for auditable structure-based drug design"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Upstream authorship retained for attribution.
authors = [{ name = "Nous Research (upstream Hermes Agent)" }]
license = "MIT AND BSD-3-Clause AND GPL-2.0-only"
license-files = [
  "licenses/LICENSE",
  "licenses/THIRD_PARTY_NOTICES.md",
  "licenses/viewers/*.LICENSE.txt",
  "skills/bio_research/input-normalization/scripts/openbabel_fast_compat/COPYING",
  "skills/bio_research/report-generator/assets_src/*.LICENSE.txt"
]
# Direct versions retained from the upstream snapshot; scientific tools are provisioned separately.
dependencies = [
  "openai==2.24.0",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.3",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "requests==2.33.0",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "prompt_toolkit==3.0.52",
  "packaging==26.0",
  "urllib3>=2.7.0,<3",
  "tzdata==2025.3; sys_platform == 'win32'",
  "psutil==7.2.2",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
  "Pillow==12.2.0"
]

[project.optional-dependencies]
cli = ["simple-term-menu==1.6.6"]
anthropic = ["anthropic==0.87.0"]
bedrock = ["boto3==1.42.89"]
azure-identity = ["azure-identity==1.25.3"]
modal = ["modal==1.3.4"]
daytona = ["daytona==0.155.0"]

[tool.setuptools]
py-modules = ["run_agent", "cli"]
# setup.py declares all data_files: the fixed SOUL.md, locales, skills, and memory.

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "drugmate_cli", "drugmate_cli.*", "drugmate_runtime", "drugmate_runtime.*", "providers", "providers.*"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule

[tool.ruff.lint]
# Require explicit text encodings to prevent locale-dependent corruption.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Scientific skills retain their source conventions.
"skills/**" = ["PLW1514"]
